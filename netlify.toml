# Build command and publish directory stay in the Netlify UI.
# These variables only narrow the secrets scan.

[build.environment]
  # Turbopack's build cache stores server env values in .sst files that are
  # never published. Keep scanning the repo and the rest of the build output.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
  # The SQL port is 1433, which is also the cap height in Next's font metrics
  # and the default in src/lib/db.ts. It is not a credential.
  SECRETS_SCAN_OMIT_KEYS = "DB_PORT"
