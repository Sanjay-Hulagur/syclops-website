# Build command and publish directory stay in the Netlify UI.
# These variables only narrow the secrets scan.

[build.environment]
  # Turbopack's build cache stores server env values in .sst files that are
  # never published. Keep scanning the repo and the rest of the build output.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
  # DB_PORT is 1433, which is also a font metric in Next.
  # MASTER_DB_NAME is four characters and appears inside ordinary words on
  # the public site. This site never reads it.
  # SMTP_FROM and SMTP_USER are the public contact address printed on the
  # legal pages. SMTP_HOST is smtp.gmail.com, also written in the mail client.
  # Passwords stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "DB_PORT,MASTER_DB_NAME,SMTP_FROM,SMTP_USER,SMTP_HOST"

[[headers]]
  for = "/downloads/syclops.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Syclops.apk\""
